name: Deploy to Dev

on:
  push:
    branches:
      - feature/*

jobs:
  deploy-dev:
    environment: dev
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Debug OIDC token claims
      uses: actions/github-script@v7
      with:
        script: |
          const token = await core.getIDToken();
          const payload = JSON.parse(
            Buffer.from(token.split('.')[1], 'base64').toString()
          );
          console.log('OIDC ISSUER:', payload.iss);
          console.log('OIDC SUBJECT:', payload.sub);
          console.log('OIDC AUDIENCE:', payload.aud);

    - name: Debug GitHub context
      run: |
        echo "repository        = ${{ github.repository }}"
        echo "repository_owner  = ${{ github.repository_owner }}"
        echo "ref               = ${{ github.ref }}"
        echo "ref_name          = ${{ github.ref_name }}"

    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Login to ACR
      run: |
        az acr login --name ${{ vars.ACR_NAME }}

    - name: Set AKS Context
      uses: azure/aks-set-context@v3
      with:
        resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
        cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

    - name: Build and Push Docker Image (Dev)
      run: |
        docker build --platform linux/arm64 -t ${{ vars.ACR_LOGIN_SERVER }}/sample-app:dev .

        docker push ${{ vars.ACR_LOGIN_SERVER }}/sample-app:dev

    
    - name: Deploy to Dev Namespace
      run: |
        sed -e "s|IMAGE_NAME|${{ vars.ACR_LOGIN_SERVER }}/sample-app:dev|g" \
        -e "s|ENV_VALUE|${{ vars.DEV_ENV }}|g" \
        K8s/deployment.yml | kubectl apply -n dev -f -

        kubectl apply -n dev -f K8s/service.yml
