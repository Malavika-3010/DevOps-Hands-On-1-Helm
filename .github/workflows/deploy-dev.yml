name: Deploy to Dev

on:
  push:
    branches:
      - feature/*

jobs:
  deploy-dev:
    environment: dev
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Azure authentication (OIDC)
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Set up Docker Buildx (ARM64)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build & push ARM64 image to ACR
      - name: Build and Push Docker Image (Dev)
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -t ${{ vars.ACR_LOGIN_SERVER }}/sample-app:dev \
            --push .

      # Set AKS context
      - name: Set AKS Context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ vars.RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_NAME }}

      # Deploy using Helm
      - name: Deploy to Dev using Helm
        run: |
          helm upgrade --install sample-app ./sample-app \
            -n dev \
            --create-namespace \
            -f sample-app/values-dev.yaml